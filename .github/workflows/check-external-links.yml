# Contrôle mensuel des liens externes (sources officielles citées par le site) — voir scripts/check-external-links.js.
# Ouvre (ou complète) une issue si un lien est mort ou renvoie vers la page d'accueil de son site.
name: Liens externes (mensuel)

on:
  schedule:
    - cron: "0 6 1 * *"        # le 1er de chaque mois, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contrôler les liens externes
        id: links
        run: |
          set +e
          node scripts/check-external-links.js --markdown > link-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat link-report.md
      - name: Ouvrir une issue si un lien est mort
        if: steps.links.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Liens externes à corriger — $(date -u +%Y-%m)"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
          else
            gh issue create --title "$title" --body-file link-report.md
          fi
